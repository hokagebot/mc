 and G are isomorphic or not", "code": "import networkx as nx\nimport matplotlib.pyplot as plt\n\nG = nx.complete_graph(5)\nC = nx.complement(G)\nplt.subplot(1, 2, 1)\nnx.draw(G, with_labels=True)\nplt.title(\"G\")\nplt.subplot(1, 2, 2)\nnx.draw(C, with_labels=True)\nplt.title(\"Complement\")\nplt.show()\nprint(\"Isomorphic:\", nx.is_isomorphic(G, C))"}, {"letter": "c", "question": "Generate G graph with vertex set { 1,5,6,7,9,2 } and edge set { (1,5),(6,7),(7,9),(2,5),(6,9)} . Delete somevertices and some edges from graph G", "code": "import networkx as nx\nimport matplotlib.pyplot as plt\n\nG = nx.Graph()\nG.add_nodes_from([1, 5, 6, 7, 9, 2])\nG.add_edges_from([(1, 5), (6, 7), (7, 9), (2, 5), (6, 9)])\nG.remove_node(9)\nG.remove_edge(1, 5)\nnx.draw(G, with_labels=True, node_color=\"lightblue\", node_size=700)\nplt.show()\nprint('Vertices:', list(G.nodes()))\nprint('Edges:', list(G.edges()))"}]}, {"qnum": "3", "items": [{"letter": "a", "question": "Find adjacency matrix and incidence matrix of ofC7", "code": "import networkx as nx\nimport matplotlib.pyplot as plt\n\nG = nx.cycle_graph(7)\nprint('Adjacency matrix:')\nprint(nx.adjacency_matrix(G).todense())\nprint('Incidence matrix:')\nprint(nx.incidence_matrix(G, oriented=False).todense())"}, {"letter": "b", "question": "Draw a directed graph D with vertex set V = { 1 , 2 , 3 , a , b , c } and edge set E = { (1,2) , (2,a) , (a,b) , (b,c) , (2,b) }. Find indegree of all vertices", "code": "import networkx as nx\nimport matplotlib.pyplot as plt\n\nD = nx.DiGraph()\nV = [1, 2, 3, 'a', 'b', 'c']\nE = [(1, 2), (2, 'a'), ('a', 'b'), ('b', 'c'), (2, 'b')]\nD.add_nodes_from(V)\nD.add_edges_from(E)\nnx.draw(D, with_labels=True, arrows=True)\nplt.show()\nprint('In-degree:', dict(D.in_degree()))\nprint('Out-degree:', dict(D.out_degree()))"}, {"letter": "c", "question": "Draw any n-ary tree of height h", "code": "import networkx as nx\nimport matplotlib.pyplot as plt\n\nT = nx.balanced_tree(2, 2)\nnx.draw(T, with_labels=True)\n ize=700)\nplt.show()\nprint('Eulerian:', nx.is_eulerian(G))\nprint('Has Eulerian path:', nx.has_eulerian_path(G))"}, {"letter": "c", "question": "Draw the any connected graph and find it’s vertex connectivity and edge connectivity", "code": "import networkx as nx\nimport matplotlib.pyplot as plt\n\nG = nx.cycle_graph(6)\nnx.draw(G, with_labels=True, node_color=\"lightblue\", node_size=700)\nplt.show()\nprint('Vertex connectivity:', nx.node_connectivity(G))\nprint('Edge connectivity:', nx.edge_connectivity(G))"}]}]}];const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');const nav=document.getElementById('nav'),content=document.getElementById('content');
DATA.forEach((s,i)=>{let id='slip'+(i+1);nav.innerHTML+=`<button class="nav" data-id="${id}">Slip ${i+1}</button>`;let h=`<section class="slip" id="${id}"><h2 class="slip-title">Slip ${i+1}</h2>`;s.groups.forEach(g=>{h+=`<div class="qhead">Q.${g.qnum}. Attempt any two of the following.</div>`;g.items.forEach(q=>{h+=`<div class="question"><div class="qtext"><b>${q.letter})</b> ${esc(q.question)}</div><div class="codehead"><span class="prompt">In [ ]:</span><button class="copy">Copy Code</button></div><pre>${esc(q.code)}</pre></div>`})});content.innerHTML+=h+'</section>'});
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.id).scrollIntoView({behavior:'smooth'})});document.addEventListener('click',async e=>{let b=e.target.closest('.copy');if(!b)return;let txt=b.closest('.question').querySelector('pre').innerText;try{await navigator.clipboard.writeText(txt)}catch(err){let t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy Code',1200)});document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.question').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'':'none');document.querySelectorAll('.slip').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'':'none');document.querySelectorAll('.nav').forEach(b=>b.style.display=document.getElementById(b.dataset.id).style.display==='none'?'none':'')});
